<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms002</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>

    <h1>Teste de Formulário - Senha e Usuário</h1>

    <form action="cadastro.php" method="post">
        <!--Área do formulário-->
        <div>
            <label for="idusuario">Usuário</label>
            <input type="text" name="usuario" id="idusuario" maxlength="15" size="30" placeholder="Máximo de 15 Letras" autocomplete="username">
        </div>

        <div>
            <label for="idsenha">Senha</label>
            <input type="password" name="senha" id="idsenha" required minlength="8" maxlength="20" size="32" placeholder="Mínimo de 8 caracteres" autocomplete="current-password">
        </div>

        <!--Área dos botões-->
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>


    </form>
    
    
    
    <a href="ex012.html" rel="prev"><button>Voltar</button></a>
    
</body>
</html>
